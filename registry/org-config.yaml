# Org-layer customization (architecture §5.10 rule 4)
# Per-phase model tier. UNLISTED PHASES FALL BACK TO `generate` — which silently put
# eight of ten phases on the authoring-grade model, including bounded, structured jobs
# that never needed it. Every phase is now named deliberately: pick the cheapest tier
# that can do the job, and say why when it is not the cheapest.
# Keys here must match `phases:` and llm_runner.ALL_PHASES EXACTLY — pinned by
# test_phase_inventory.py. Three keys were removed as phantoms: `resolve` and
# `resolve_llm` (two names for the one LLM routing fallback, ADR-5 step 2, now
# deliberately not built — see architecture §5.8.2) and `escalate` (a retry
# tier for an escalation nothing implements). Nothing dispatched any of them,
# so tuning them changed nothing while looking like it did.
models:
  triage: claude-haiku-4-5-20251001     # classify a diff's impact — bounded
  analyze: claude-haiku-4-5-20251001    # extract behaviors from a ticket — extraction
  testdata: claude-haiku-4-5-20251001   # emit fixtures from a fixed schema
  critic: claude-haiku-4-5-20251001     # advisory score, never gates a commit
  validate: claude-haiku-4-5-20251001   # run specs, read failures, repair narrowly
  # Judgement-grade. The plan is what a human signs off, and the adversary's whole
  # value is catching what a competent author missed — cheap models agree too easily.
  testplan: claude-sonnet-4-6
  planadversary: claude-sonnet-4-6
  planarbiter: claude-sonnet-4-6
  generate: claude-sonnet-4-6           # writes the code that gets committed
# LLM Runner port (docs/multi-llm-providers.md). `provider` is the global
# default; `phase_providers` overrides per phase (e.g. local Ollama for
# triage/analyze, claude for judgement + agentic phases). AIQE_LLM_PROVIDER
# (the Settings switch) beats both. Agentic phases (generate, validate) refuse
# a completion-only provider at CONFIG time — there is no silent fallback.
# `models_by_provider` maps the tier ids in `models:` to each provider's own.
llm:
  provider: claude
  phase_providers: {}
  # Tier id -> the provider's own model id. Model ids are CONFIGURED, never
  # guessed — `llm_runner.py validate` refuses a provider that would receive a
  # claude-namespace id, because that failure otherwise surfaces deep inside
  # the vendor CLI as "unknown model", long after anyone would connect it to a
  # provider switch. Codex ships mapped so the switch works out of the box;
  # ollama does not, because the right id depends on what you have PULLED.
  # NOTE: mapping every tier to one model makes the degradation ladder's cheap
  # tier a no-op for that provider — point the haiku tier at a cheaper model
  # if you want 60%-of-envelope downgrades to actually save anything.
  models_by_provider:
    # ollama:                              # uncomment with ids you have pulled
    #   claude-haiku-4-5-20251001: qwen2.5-coder:7b
    #   claude-sonnet-4-6: qwen2.5-coder:32b
    codex:
      claude-haiku-4-5-20251001: gpt-5-codex
      claude-sonnet-4-6: gpt-5-codex
      claude-opus-4-8: gpt-5-codex

phases:
  triage:    { max_turns: 12, allowed_tools: "Read,Bash(git diff:*)" }   # 5 was too tight for real tool use (parity finding P1)
  analyze:   { max_turns: 12, allowed_tools: "Read" }
  testplan:  { max_turns: 10, allowed_tools: "Read,Write" }
  # Plan adversary/arbiter: an independent challenge to the authored plan before a
  # human ever sees it. The adversary is READ-ONLY on purpose — an opponent that can
  # edit the plan is just a second author, and the whole value is that it argues from
  # outside. Only the arbiter writes, and only to testplans/.
  planadversary: { max_turns: 8,  allowed_tools: "Read" }
  planarbiter:   { max_turns: 10, allowed_tools: "Read,Write" }
  testdata:  { max_turns: 10, allowed_tools: "Read,Write" }
  generate:  { max_turns: 25, allowed_tools: "Read,Write,Edit,Bash(npx playwright test:*),Bash(npm run lint:*)" }
  validate:  { max_turns: 15, allowed_tools: "Read,Edit,Bash(npx playwright test:*)" , repair_loops: 3 }
  # Read-only ON PURPOSE: a critic that can Write/Edit is an unreviewed repair loop,
  # not a second opinion. Advisory status depends on it staying this way (§3.2).
  critic:    { max_turns: 8,  allowed_tools: "Read" }
# How much this platform depends on OpenHands (docs/integrations/standalone-operation.md):
#   off       never contact it — the estate runs standalone (CI / TaskEvent / queue)
#   auto      hybrid (default): use it when reachable, fall back when not; an outage
#             is reported as `degraded` and is never fatal
#   required  a hard dependency — an outage fails `make check-integrations`
# AIQE_OPENHANDS overrides this for a single run.
openhands:
  mode: auto
# Advisory critic (openhands-review §3.2). Scores generated-test QUALITY for the human
# reviewer and the "escaped noise" metric — it NEVER gates a commit. Thresholds only
# label the score; AIQE_CRITIC=0 skips the phase for a single run.
critic:
  enabled: true
  accept_threshold: 0.8
  review_threshold: 0.5
# Adversarial test-plan review: after the plan is authored, a second agent hunts for
# what it missed (negative/boundary/authz/state/cross-repo gaps) and an arbiter folds
# the accepted findings in. Costs two extra cheap phases on Workflow B and only ever
# ADDS scenarios. Degrades safely: if either phase fails the authored plan stands.
# AIQE_PLAN_ADVERSARY=0 skips it for a single run.
plan_adversary:
  enabled: true
# Per-repo generation fan-out: one agent per resolved test repo, each seeing only its
# own repo's conventions, so a contract change fanning out to three repos can't
# cross-wire their approaches. Falls back to a single call when one repo resolved.
# AIQE_GENERATE_FANOUT=0 forces the single-agent path.
generate_fanout:
  enabled: true
# Optional review rota: keys committed by a run are ASSIGNED round-robin-by-hash to
# one of these names (shown on the board and in digests). Assignment is a nudge —
# anyone may still review, and the decision records the actual actor. Empty = off.
review:
  reviewers: []
resolution:
  confidence_threshold: 0.8
  clarify_channels: [tracker, notify]   # post question to Jira + Slack when below threshold
catalog:
  auto_accept_confidence: 0.85
  review_band: [0.5, 0.85]
# Retrieval-scoped context (cost-reduction 2.2): which phases get a per-run
# chunk assembly instead of the full AGENTS.md. Judgement phases (testplan,
# generate, the plan adversary pair) stay on the full estate until the paired
# quality eval (story 7.2) clears them — flipping one to `on` is a quality
# decision, not a config tweak. AIQE_CONTEXT_SCOPE=0 kills it globally.
context_scope:
  triage: on
  analyze: on
  testdata: on
  testplan: off
  generate: off
  planadversary: off
  planarbiter: off
context_budget: 4000        # tokens; MUST-KEEP chunks may exceed it

# Spec-driven development (docs/spec-driven-stories.md). The requirements gate
# makes `pipeline.sh plan|jira` refuse until a human validated the EARS
# requirements (make requirements KEY=.. -> review -> requirements-approve).
# Off = today's flow, byte for byte.
spec:
  requirements_gate: off
  # Spec-satisfaction gate check (SDD 3.2): off = absent, warn = findings
  # print but the gate proceeds, strict = exit 8 (cover, waive with a reason
  # in specs/<KEY>/waivers.yaml, or re-approve). Strict only after a
  # warn-mode sprint proves the signal clean (two-step rollout by design).
  enforce: off

# Semantic artifact reuse (cost-reduction 3.3). plan_threshold is deliberately
# conservative: a wrong reuse is a confidently incorrect plan, and only the
# human diff step makes reuse safe at all. AIQE_PLAN_REUSE=1 enables (plan
# mode only); default stays off until the 7.2 quality eval.
reuse:
  plan_threshold: 0.80

# List prices ($ per MILLION tokens) for providers that report tokens but no
# cost (multi-LLM 4.1). A figure computed from this table is an ESTIMATE and
# renders with ~ — it can never masquerade as a provider-reported bill.
# `local` means exactly that: $0, tokens still tracked. A provider/model with
# no entry keeps cost UNKNOWN rather than silently 0.
pricing:
  ollama: local
  codex:
    "*": {in: 1.25, out: 10.0}

budgets:
  max_cost_usd_single_suite: 2.0
  max_cost_usd_cross_repo: 4.0
  # Per-workflow envelopes (cost-reduction 5.2): beat the generic pair above;
  # explicit MAX_COST_USD_PER_RUN env still wins. The degradation ladder (5.3)
  # grades against the same envelope: 60% = cheap tier for non-judgement
  # phases, 80% = halve scoped context too, 100% = abort (exit 77).
  envelopes:
    pr: 1.50
    jira: 4.00
    plan: 1.00
    tests: 3.00
  # Embedding spend guard (cost-reduction 3.2): the vector index stops
  # refreshing past the daily cap (queries fall back to TF-IDF); price is the
  # $/M-token estimate used for the day ledger, not a billed figure.
  max_embed_usd_per_day: 0.50
  embed_price_per_mtok: 0.02
  # Cost-regression alarm (1.4): maintain compares trailing per-phase medians
  # against the frozen baseline (make cost-baseline) and notifies over this.
  cost_regression_threshold: 0.25
knowledge:
  confluence_max_pages: 3
  confluence_max_tokens: 12000
adapters:
  scm: { github: adapters/scm/github.sh, bitbucket: adapters/scm/bitbucket.sh, stash: adapters/scm/stash.sh }
  tracker: adapters/tracker/jira.sh
  knowledge: adapters/knowledge/confluence.sh
  cicd: adapters/cicd/jenkins.sh
  notify: adapters/notify/slack.sh
  telemetry: adapters/telemetry/splunk.sh

# Transaction log (observability epic). The log is append-only, so retention is
# shipped WITH writing rather than later: an unbounded log is a disk-full
# incident scheduled for a future date.
observability:
  retain_days: 30
