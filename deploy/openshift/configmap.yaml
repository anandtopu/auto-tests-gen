# Non-secret runtime configuration. Secrets (tokens, credentials) live in the Secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-qe-config
  labels:
    app.kubernetes.io/part-of: ai-qe
data:
  # "1" = mock adapters + demo estate (no external calls, no credentials).
  # "0" = real adapters (requires the Secret credentials + a real-tools image).
  AIQE_MOCK: "1"
  # Servers must bind 0.0.0.0 inside the pod to be reachable from the Service.
  AIQE_UI_HOST: "0.0.0.0"
  AIQE_UI_PORT: "4999"
  AIQE_HOOK_HOST: "0.0.0.0"
  AIQE_HOOK_PORT: "4998"
  # 1 = the receiver drains the queue in-process when it accepts an event.
  AIQE_HOOK_AUTORUN: "0"
  # The Settings page WRITES this file, and the pipeline reads it back through
  # the same resolver (props_file dotenv-defaults -> settings_store.load).
  # It must therefore live on a writable mount: readOnlyRootFilesystem is
  # true on both containers, and /app/.env -- the default -- is on the
  # read-only rootfs, so without this every Settings save fails in-cluster
  # and no provider or credential set through the UI ever reaches a run.
  AIQE_ENV_FILE: "/state/.env"
  # Real-mode SCM selection (ignored in mock mode).
  SCM_KIND: "github"
