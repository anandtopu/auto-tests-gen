# One pod, two containers (dashboard + receiver) sharing the state volume and the
# ephemeral scratch dirs — they coordinate through fs_lock on the shared filesystem,
# so they MUST co-locate. replicas: 1 + Recreate matches the single-writer model
# (the pipeline holds an exclusive per-checkout run lock).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-qe
  labels:
    app.kubernetes.io/name: ai-qe
    app.kubernetes.io/part-of: ai-qe
spec:
  replicas: 1
  strategy:
    type: Recreate                     # never two writers against one RWO PVC
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-qe
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-qe
        app.kubernetes.io/part-of: ai-qe
    spec:
      # OpenShift assigns a random non-root UID and an fsGroup from the namespace
      # range — do NOT pin runAsUser/fsGroup here. On vanilla Kubernetes the image's
      # USER 1001 applies; if your CSI driver creates root-owned volumes, add
      # `fsGroup: 1001` here (see docs/deployment.md → "Vanilla Kubernetes").
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dashboard
          image: ai-qe-platform:latest      # overridden by kustomize / deploy.sh
          # `args:`, NOT `command:`. In Kubernetes `command` replaces the
          # image ENTRYPOINT and `args` replaces CMD — the opposite mapping to
          # docker-compose, where `command:` means CMD. With `command:` here,
          # ENTRYPOINT (tini -> bin/container-entrypoint.sh) never ran, so a
          # fresh deployment did NO first-boot state seeding — the exact
          # failure `make test-entrypoint`'s 17 checks exist to prevent — and
          # lost tini as PID 1 as well. Proven with podman: replacing the
          # entrypoint skips the seeding, overriding CMD runs it.
          args: ["python3", "bin/dashboard_server.py"]
          ports:
            - name: ui
              containerPort: 4999
          env:
            # Mutable state lives here, never in the image tree (R12).
            - { name: AIQE_STATE_DIR, value: /state }
          envFrom:
            - configMapRef:
                name: ai-qe-config
            - secretRef:
                name: ai-qe-secrets
          readinessProbe:
            tcpSocket: { port: ui }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: ui }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { cpu: "1",    memory: "1Gi" }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            # R12. Safe ONLY because every mutable path is relocated to /state
            # (AIQE_STATE_DIR) instead of being written inside /app — see
            # engine/lib/app_paths.py and docs/review-readonly-rootfs.md.
            # Setting this without that relocation breaks every run: AGENTS.md
            # is regenerated on each one and lives at the tree root, where no
            # volume mount can reach it.
            readOnlyRootFilesystem: true
          volumeMounts:
            - { name: reports,   mountPath: /app/reports }
            - { name: workspace, mountPath: /app/workspace }
            - { name: out,       mountPath: /app/out }
            - { name: tmp,       mountPath: /tmp }
            - { name: state,     mountPath: /state }
        - name: receiver
          image: ai-qe-platform:latest
          # See the note on the dashboard container: args, never command.
          args: ["python3", "bin/taskevent_receiver.py"]
          ports:
            - name: hook
              containerPort: 4998
          env:
            # Mutable state lives here, never in the image tree (R12).
            - { name: AIQE_STATE_DIR, value: /state }
          envFrom:
            - configMapRef:
                name: ai-qe-config
            - secretRef:
                name: ai-qe-secrets
          readinessProbe:                    # unauthenticated health endpoint
            httpGet: { path: /healthz, port: hook }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: hook }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: "50m",  memory: "128Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            # R12. Safe ONLY because every mutable path is relocated to /state
            # (AIQE_STATE_DIR) instead of being written inside /app — see
            # engine/lib/app_paths.py and docs/review-readonly-rootfs.md.
            # Setting this without that relocation breaks every run: AGENTS.md
            # is regenerated on each one and lives at the tree root, where no
            # volume mount can reach it.
            readOnlyRootFilesystem: true
          volumeMounts:
            - { name: reports,   mountPath: /app/reports }
            - { name: workspace, mountPath: /app/workspace }
            - { name: out,       mountPath: /app/out }
            - { name: tmp,       mountPath: /tmp }
            - { name: state,     mountPath: /state }
      volumes:
        # `mktemp` in adapters/scm/{github,bitbucket,stash}.sh and bin/with-env.sh,
        # and tempfile in bin/taskevent_receiver.py, all need a writable /tmp.
        # Mounted NOW so it is not missed when readOnlyRootFilesystem is turned
        # on: podman --read-only supplies a /tmp tmpfs automatically, Kubernetes
        # does not — so a podman-only proof passes while the cluster fails.
        # See docs/review-readonly-rootfs.md (R12).
        - name: tmp
          emptyDir: {}
        # Mutable application state: catalog mappings, the repo registry,
        # knowledge, plans, specs, testdata, generated AGENTS.md. Persistent
        # because it IS somebody's work — the same PVC as reports/, under a
        # subPath, so a deployment still needs only one claim.
        - name: state
          persistentVolumeClaim:
            claimName: ai-qe-reports
        - name: reports
          persistentVolumeClaim:
            claimName: ai-qe-reports
        - name: workspace
          emptyDir: {}
        - name: out
          emptyDir: {}
